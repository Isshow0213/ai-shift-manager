<div class="overview-display-controls" data-overview-controls hidden>
  <div class="overview-zoom-controls" role="group" aria-label="シフト表の拡大・縮小">
    <button class="button button-secondary button-small" type="button" data-overview-zoom-out aria-label="シフト表を縮小">− 縮小</button>
    <output class="overview-zoom-value" data-overview-zoom-value aria-live="polite" aria-atomic="true" aria-label="シフト表の表示倍率">100%</output>
    <button class="button button-secondary button-small" type="button" data-overview-zoom-in aria-label="シフト表を拡大">＋ 拡大</button>
    <button class="button button-secondary button-small" type="button" data-overview-zoom-reset aria-label="シフト表の表示倍率を100%に戻す">100%に戻す</button>
  </div>
  <button class="button button-secondary button-small overview-fullscreen-button" type="button" data-overview-fullscreen aria-controls="overview-board" aria-pressed="false">全画面で表示</button>
</div>
